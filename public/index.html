<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Spin — Random Fruit Selector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #ef4444, #f59e0b, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1100px;
      width: 100%;
    }

    @media (min-width: 850px) {
      .container {
        grid-template-columns: 1fr 340px;
      }
    }

    .wheel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      margin-bottom: 2rem;
    }

    /* Pointer Arrow */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 38px;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .pointer::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid #ef4444;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 420px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .spin-btn {
      flex: 1;
      background: var(--accent);
      color: #000;
      padding: 1rem;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    }

    .spin-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .sound-btn {
      background: #334155;
      color: var(--text);
      padding: 1rem;
      width: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-btn:hover {
      background: #475569;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 1.5rem;
    }

    .panel h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fruit-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .fruit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }

    .fruit-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
    }

    .remove-btn {
      background: transparent;
      color: #ef4444;
      font-size: 1.2rem;
      padding: 0 0.4rem;
    }

    .remove-btn:hover {
      color: #dc2626;
    }

    .add-fruit-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .add-fruit-form input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      font-size: 0.9rem;
    }

    .add-fruit-form input:focus {
      outline: 2px solid var(--accent);
    }

    .add-btn {
      background: #334155;
      color: var(--text);
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
    }

    .add-btn:hover {
      background: #475569;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      font-size: 0.9rem;
      color: var(--text-muted);
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: bounce 1s infinite alternate;
    }

    .modal h3 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .modal p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: var(--accent);
      color: #000;
      padding: 0.8rem 2rem;
      width: 100%;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Fruit Spin 🍓</h1>
    <p>Can't decide what fruit to eat? Spin the wheel!</p>
  </header>

  <div class="container">
    <div class="wheel-card">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
      </div>

      <div class="controls">
        <button class="spin-btn" id="spinBtn">SPIN WHEEL</button>
        <button class="sound-btn" id="soundBtn" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h2>Active Fruits</h2>
        <div class="fruit-list" id="fruitList"></div>
        
        <form class="add-fruit-form" id="addForm">
          <input type="text" id="emojiInput" placeholder="🍎" maxlength="2" style="width: 50px; text-align: center;" required>
          <input type="text" id="nameInput" placeholder="Apple" required>
          <button type="submit" class="add-btn">+</button>
        </form>
      </div>

      <div class="panel">
        <h2>Spin History</h2>
        <div class="history-list" id="historyList">
          <div style="color: var(--text-muted); font-size: 0.85rem;">No spins yet.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-emoji" id="modalEmoji">🍎</div>
      <h3 id="modalName">Apple</h3>
      <p>Your fresh fruit choice is ready!</p>
      <button class="close-btn" id="closeModal">Awesome!</button>
    </div>
  </div>

  <script>
    // Initial Fruit Items
    let fruits = [
      { name: 'Apple', emoji: '🍎', color: '#ef4444' },
      { name: 'Banana', emoji: '🍌', color: '#eab308' },
      { name: 'Watermelon', emoji: '🍉', color: '#22c55e' },
      { name: 'Grape', emoji: '🍇', color: '#a855f7' },
      { name: 'Orange', emoji: '🍊', color: '#f97316' },
      { name: 'Strawberry', emoji: '🍓', color: '#f43f5e' },
      { name: 'Pineapple', emoji: '🍍', color: '#eab308' },
      { name: 'Kiwi', emoji: '🥝', color: '#84cc16' }
    ];

    const palette = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899'];

    // DOM Elements
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const soundBtn = document.getElementById('soundBtn');
    const fruitListEl = document.getElementById('fruitList');
    const historyListEl = document.getElementById('historyList');
    const addForm = document.getElementById('addForm');
    const modal = document.getElementById('modal');
    const modalEmoji = document.getElementById('modalEmoji');
    const modalName = document.getElementById('modalName');
    const closeModal = document.getElementById('closeModal');

    // State Variables
    let currentAngle = 0;
    let isSpinning = false;
    let soundEnabled = true;
    let audioCtx = null;
    let lastSegmentIndex = -1;

    // Audio Synthesizer for self-contained sound effects
    function playSound(type) {
      if (!soundEnabled) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        const now = audioCtx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // Render Wheel
    function drawWheel() {
      const numSlices = fruits.length;
      if (numSlices === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(currentAngle);

      for (let i = 0; i < numSlices; i++) {
        const angle = i * sliceAngle;

        // Draw Wedge
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius - 10, angle, angle + sliceAngle);
        ctx.fillStyle = fruits[i].color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#1e293b';
        ctx.stroke();

        // Draw Text / Emoji
        ctx.save();
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px system-ui';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;

        // Render Emoji and Name
        ctx.fillText(`${fruits[i].emoji} ${fruits[i].name}`, radius - 40, 10);
        ctx.restore();
      }

      // Draw Center Circle
      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, 2 * Math.PI);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#334155';
      ctx.stroke();

      ctx.restore();
    }

    // Spin Logic
    function spin() {
      if (isSpinning || fruits.length < 2) return;

      isSpinning = true;
      spinBtn.disabled = true;

      const numSlices = fruits.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Random target spins (between 5 to 8 full rotations plus random offset)
      const extraSpins = 5 + Math.random() * 3;
      const targetRotation = extraSpins * 2 * Math.PI;
      const startAngle = currentAngle;
      const totalRotation = startAngle + targetRotation;

      const duration = 4000; // ms
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Cubic Easing Out
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + (targetRotation * easeOut);

        // Calculate tick audio based on sector passing pointer (top = -90 degrees)
        const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
        const adjustedAngle = (normalizedAngle + Math.PI / 2) % (2 * Math.PI);
        const currentSegment = Math.floor(adjustedAngle / sliceAngle) % numSlices;

        if (currentSegment !== lastSegmentIndex) {
          playSound('tick');
          lastSegmentIndex = currentSegment;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          
          // Determine Winner
          const winningIndex = currentSegment;
          const winner = fruits[winningIndex];

          playSound('win');
          showWinner(winner);
          addHistory(winner);
        }
      }

      requestAnimationFrame(animate);
    }

    // UI Updates
    function updateFruitList() {
      fruitListEl.innerHTML = '';
      fruits.forEach((fruit, index) => {
        const item = document.createElement('div');
        item.className = 'fruit-item';
        item.innerHTML = `
          <div class="fruit-info">
            <span>${fruit.emoji}</span>
            <span>${fruit.name}</span>
          </div>
          <button class="remove-btn" onclick="removeFruit(${index})">&times;</button>
        `;
        fruitListEl.appendChild(item);
      });

      drawWheel();
    }

    function removeFruit(index) {
      if (isSpinning) return;
      fruits.splice(index, 1);
      updateFruitList();
    }

    function addHistory(winner) {
      const emptyMsg = historyListEl.querySelector('div');
      if (emptyMsg) emptyMsg.remove();

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <span>${winner.emoji} ${winner.name}</span>
        <span>${time}</span>
      `;
      historyListEl.prepend(item);
    }

    function showWinner(winner) {
      modalEmoji.textContent = winner.emoji;
      modalName.textContent = winner.name;
      modal.classList.add('active');
    }

    // Event Listeners
    spinBtn.addEventListener('click', spin);

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (isSpinning) return;

      const emoji = document.getElementById('emojiInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();

      if (emoji && name) {
        const color = palette[fruits.length % palette.length];
        fruits.push({ name, emoji, color });
        updateFruitList();

        document.getElementById('emojiInput').value = '';
        document.getElementById('nameInput').value = '';
      }
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // Initial Load
    updateFruitList();
  </script>
</body>
</html>
